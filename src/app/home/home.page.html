<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>CHOAYO STORE</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content color="light">
  
  <div class="header-background">
    <ion-card class="points-card">
      <ion-card-header>
        <ion-card-title>Mis Puntos</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <div class="points-display">
          <h1>{{ usuario.puntos }}</h1>
          <ion-icon name="star" color="warning"></ion-icon>
        </div>
        <p>Nivel actual: <strong>{{ usuario.nivel }}</strong></p>
      </ion-card-content>
    </ion-card>
  </div>

  <ion-grid class="action-grid">
    <ion-row>
      <ion-col size="6">
        <ion-card class="action-card">
          <ion-icon name="scan-outline" color="primary"></ion-icon>
          <p>Escanear QR</p>
        </ion-card>
      </ion-col>
      <ion-col size="6">
        <ion-card class="action-card">
          <ion-icon name="gift-outline" color="secondary"></ion-icon>
          <p>Recompensas</p>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
