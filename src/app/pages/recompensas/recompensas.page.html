<ion-content class="recompensas-bg">
  <div class="header-section">
    <h2>Catálogo de Recompensas</h2>
    <p>Tienes <strong>{{ usuario.puntos }} pts</strong> disponibles</p>
  </div>

  <div class="catalog-grid">
    <div class="reward-item" *ngFor="let item of catalogo">
      <div class="icon-box" [ngClass]="item.colorClass">
        <img [src]="item.imagen" [alt]="item.nombre" class="recompensa-img" />
      </div>
      <div class="item-details">
        <h3>{{ item.nombre }}</h3>
        <p>{{ item.costo }} pts</p>
      </div>
      <button class="btn-canjear" (click)="confirmarCanje(item)">Canjear</button>
    </div>
  </div>

  <ion-modal [isOpen]="isModalOpen" (didDismiss)="cerrarModal()" class="custom-modal">
    <ng-template>
      <div class="modal-wrapper">
        <div class="modal-body">
          <div class="icon-circle" [ngClass]="modalData.color === 'success' ? 'success-color' : 'error-color'">
            <ion-icon [name]="modalData.icono"></ion-icon>
          </div>
          <h2>{{ modalData.titulo }}</h2>
          <p>{{ modalData.mensaje }}</p>
          <button class="modal-btn" (click)="cerrarModal()">Aceptar</button>
        </div>
      </div>
    </ng-template>
  </ion-modal>
</ion-content>
