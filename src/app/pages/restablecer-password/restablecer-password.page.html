<ion-content class="custom-bg">
  <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100%; padding: 24px;">

    <div style="background: #2a2a35; border-radius: 16px; padding: 32px 24px; max-width: 400px; width: 100%;">

      <h2 style="color: #ffffff; text-align: center; margin-bottom: 8px;">Restablecer Contraseña</h2>
      <p style="color: #aaaaaa; text-align: center; font-size: 14px; margin-bottom: 24px;">
        Ingresa tu nueva clave de acceso.
      </p>

      <ng-container *ngIf="!exito">
        <input
          type="password"
          placeholder="Nueva Contraseña"
          [(ngModel)]="nuevaPassword"
          style="width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #1f1f28; color: #ffffff; outline: none; font-size: 16px; box-sizing: border-box;"
        />

        <input
          type="password"
          placeholder="Confirmar Contraseña"
          [(ngModel)]="confirmarPassword"
          style="width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #444; background: #1f1f28; color: #ffffff; outline: none; font-size: 16px; box-sizing: border-box;"
        />

        <button
          (click)="guardarNuevaPassword()"
          [disabled]="cargando"
          style="width: 100%; padding: 14px; border-radius: 8px; border: none; background: #6c63ff; color: #ffffff; font-weight: 600; font-size: 16px; cursor: pointer;"
        >
          {{ cargando ? 'Guardando...' : 'Guardar nueva contraseña' }}
        </button>
      </ng-container>

      <p
        *ngIf="mensaje"
        [style.color]="exito ? '#4caf50' : '#ff6b6b'"
        style="font-size: 13px; margin-top: 16px; text-align: center;"
      >
        {{ mensaje }}
      </p>

    </div>

  </div>
</ion-content>
