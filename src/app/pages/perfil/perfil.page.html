<ion-content class="perfil-bg">
  <div class="profile-header">
    <div class="avatar-container">
      <h2>{{ usuario?.nombre?.charAt(0) || 'U' }}</h2>
    </div>
    <h2>{{ usuario?.nombre }}</h2>
    <p>{{ usuario?.correo }}</p>
  </div>

  <div class="level-card">
    <div class="level-info">
      <span class="badge">NIVEL {{ usuario?.nivel || 'ORO' }}</span>
      <h3>Tus Puntos</h3>
    </div>
    <div class="points-info">
      <ion-icon name="star"></ion-icon>
      <h2>{{ usuario?.puntos || 0 }}</h2>
    </div>
  </div>

  <div class="options-menu">
    
    <!-- Botón de Editar Perfil arreglado y enlazado -->
    <a class="menu-item" routerLink="/editar-perfil" style="text-decoration: none; color: inherit; display: flex; align-items: center;">
      <div class="item-icon" style="background: #e5f0ff; color: #2196f3;">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <div class="item-text" style="flex: 1;">Editar Perfil</div>
      <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
    </a>

    <!-- Botón de Seguridad -->
    <div class="menu-item">
      <div class="item-icon bg-purple">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
      </div>
      <div class="item-text" style="flex: 1;">Seguridad y Contraseña</div>
      <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
    </div>

    <!-- Botón de Notificaciones -->
    <div class="menu-item">
      <div class="item-icon" style="background: #fff4e5; color: #ff9800;">
        <ion-icon name="notifications-outline"></ion-icon>
      </div>
      <div class="item-text" style="flex: 1;">Notificaciones</div>
      <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
    </div>

  </div>

  <button class="logout-btn" (click)="cerrarSesion()">
    <ion-icon name="log-out-outline"></ion-icon> Cerrar Sesión
  </button>
</ion-content>
