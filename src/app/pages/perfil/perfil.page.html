<ion-content class="perfil-bg">

  <div class="profile-header">

    <div class="avatar-container" (click)="mostrarAvatares = true">

      <img
        *ngIf="avatarSeleccionado"
        [src]="avatarSeleccionado"
        class="profile-img"
      />

      <div *ngIf="!avatarSeleccionado" class="avatar-default">
        <h2>{{ usuario?.nombre?.charAt(0) || 'U' }}</h2>
      </div>

    </div>

    <p class="change-avatar" (click)="mostrarAvatares = true">
      Cambiar avatar
    </p>

    <h2>{{ usuario?.nombre }}</h2>
    <p>{{ usuario?.correo }}</p>
  </div>

  <div class="avatar-modal" *ngIf="mostrarAvatares">
    <div class="avatar-box">

      <h3>Selecciona tu avatar</h3>

      <div class="avatar-grid">
        <img
          *ngFor="let avatar of avatares"
          [src]="avatar"
          class="avatar-option"
          (click)="seleccionarAvatar(avatar)"
        />
      </div>

      <button class="close-btn" (click)="mostrarAvatares = false">
        Cerrar
      </button>

    </div>
  </div>

  <div class="level-card">
    <div class="level-info">
      <span class="badge">NIVEL {{ usuario?.nivel || 'ORO' }}</span>
      <h3>Tus Puntos</h3>
    </div>

    <div class="points-info">
      <ion-icon name="star"></ion-icon>
      <h2>{{ usuario?.puntos || 0 }}</h2>
    </div>
  </div>

  <div class="options-menu">

    <a class="menu-item" routerLink="/editar-perfil">
      <div class="item-icon" style="background: #e5f0ff; color: #2196f3;">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <div class="item-text">Editar Perfil</div>
      <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
    </a>

    <div class="menu-item">
      <div class="item-icon bg-purple">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
      </div>
      <div class="item-text">Seguridad y Contraseña</div>
      <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
    </div>

    <div class="menu-item">
      <div class="item-icon" style="background: #fff4e5; color: #ff9800;">
        <ion-icon name="notifications-outline"></ion-icon>
      </div>
      <div class="item-text">Notificaciones</div>
      <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
    </div>

  </div>

  <button class="logout-btn" (click)="cerrarSesion()">
    <ion-icon name="log-out-outline"></ion-icon>
    Cerrar Sesión
  </button>

</ion-content>
