<ion-content class="login-bg">
  <div class="login-container">
    
    <div class="logo-section" style="margin-bottom: 20px;">
      <div class="gift-box" style="width: 60px; height: 60px;">
        <ion-icon name="gift" style="font-size: 35px;"></ion-icon>
      </div>
    </div>

    <div class="white-card">
      <div class="card-header">
        <h1>Crear cuenta</h1>
        <p>Completa tus datos para empezar</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="registrar()">
        <div class="input-group">
          <ion-icon name="person-outline" class="input-icon"></ion-icon>
          <input type="text" formControlName="fullName" placeholder="Nombre completo">
        </div>

        <div class="input-group">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <input type="email" formControlName="email" placeholder="Correo electrónico">
        </div>

        <div class="input-group">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <input [type]="passwordType" formControlName="password" placeholder="Contraseña">
        </div>

        <div class="input-group">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <input [type]="confirmPasswordType" formControlName="confirmPassword" placeholder="Confirmar contraseña">
        </div>

        <div class="options">
          <ion-checkbox labelPlacement="end" justify="start">Acepto los términos y condiciones</ion-checkbox>
        </div>

        <button type="submit" class="main-btn" [disabled]="registerForm.invalid">
          Registrarme
        </button>
      </form>

      <div class="footer">
        <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
      </div>
    </div>

  </div>
</ion-content>
