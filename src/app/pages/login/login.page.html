<ion-content class="ion-padding" color="light">
  <div class="login-container">
    
    <div class="header-section">
      <h1>Bienvenido</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()" class="form-section">
      
      <ion-input 
        type="email" 
        formControlName="email"
        placeholder="correo@ejemplo.com" 
        fill="outline" 
        shape="round" 
        class="custom-input">
        <ion-icon slot="start" name="mail-outline" color="medium"></ion-icon>
      </ion-input>
      <ion-text color="danger" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-msg">
        <small>Ingrese un correo válido.</small>
      </ion-text>

      <ion-input 
        [type]="passwordType" 
        formControlName="password"
        placeholder="Contraseña" 
        fill="outline" 
        shape="round" 
        class="custom-input">
        <ion-icon slot="start" name="lock-closed-outline" color="medium"></ion-icon>
        <ion-button fill="clear" slot="end" (click)="togglePasswordMode()" aria-label="Mostrar contraseña">
          <ion-icon slot="icon-only" [name]="passwordIcon" color="medium"></ion-icon>
        </ion-button>
      </ion-input>
      <ion-text color="danger" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-msg">
        <small>Mínimo 6 caracteres.</small>
      </ion-text>

      <div class="options-section">
        <ion-checkbox justify="start" labelPlacement="end">Recordarme</ion-checkbox>
        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <ion-button type="submit" expand="block" color="primary" class="login-btn" [disabled]="loginForm.invalid">
        Iniciar sesión
      </ion-button>
    </form>

    <div class="footer-section">
      <p>¿No tienes cuenta? <a routerLink="/register">Crear cuenta</a></p>
    </div>

  </div>
</ion-content>
